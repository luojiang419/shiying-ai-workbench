<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>算力节点监控</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:#0d121b;color:#e7edf6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{border-bottom:1px solid #242d3d;background:#121925}header>div,main{max-width:1180px;margin:auto;padding:24px 30px}.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;border-radius:13px;background:#a8e6cb;color:#13382d;display:grid;place-items:center;font-weight:800;font-size:20px}.title{font-size:20px;font-weight:650}.subtitle{color:#91a1b7;font-size:13px;margin-top:5px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.connection{font-size:13px;color:#a8e6cb;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}.stats{display:flex;gap:12px;margin:10px 0 22px}.stat{flex:1;background:#141c29;border:1px solid #263244;border-radius:14px;padding:18px 22px}.stat span{font-size:12px;color:#91a1b7}.stat strong{display:block;font-size:29px;font-weight:600;margin-top:8px}.stat.online strong{color:#a8e6cb}.latest{padding:25px;border:1px solid #426659;border-radius:17px;background:linear-gradient(120deg,#182b2a,#141c29 75%);margin-bottom:30px}.eyebrow{font-size:12px;color:#a8e6cb;letter-spacing:.08em}.latest h1{font-size:23px;font-weight:600;margin:13px 0 10px;overflow-wrap:anywhere}.latest p{margin:0;color:#9aacc1;font-size:13px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #3c4b60;color:#dce6f3;background:#1a2636;border-radius:9px;padding:9px 15px;font-size:13px;text-decoration:none}.button.primary{border-color:#a8e6cb;background:#a8e6cb;color:#14382b;font-weight:600}.button:hover{filter:brightness(1.12)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:12px}h2{font-size:16px;margin:0}.note{color:#8294ad;font-size:12px}.nodes{display:grid;gap:13px}.node{padding:22px;background:#141c29;border:1px solid #283448;border-radius:14px}.node.offline{opacity:.74}.node-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.name{font-size:16px;font-weight:600}.host{color:#91a1b7;font-size:12px;margin-top:7px;overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:20px;background:#213e34;color:#a8e6cb}.badge.warn{background:#413821;color:#e4c88b}.badge.off{background:#30333b;color:#a3adbb}.address{font-size:14px;margin-top:20px;overflow-wrap:anywhere;color:#d7e4f5}.details{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;margin-top:19px}.label{font-size:11px;color:#8395ae;margin-bottom:7px}.value{font-size:13px;line-height:1.6;overflow-wrap:anywhere}.value.muted{color:#a0aec1}.node .actions{margin-top:17px}.empty{padding:50px;text-align:center;border:1px dashed #334155;border-radius:15px;color:#8fa3bd}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 20px;border:1px solid #415f56;border-radius:10px;background:#20382e;color:#d5f5e5;font-size:13px;z-index:3}.error{color:#f1b3a4}footer{margin:25px 0;color:#788ba5;font-size:12px;line-height:1.8}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}@media(max-width:650px){header>div,main{padding:20px 17px}.top{align-items:flex-start}.connection{font-size:11px;margin-top:5px}.title{font-size:18px}.subtitle{max-width:220px;font-size:11px;line-height:1.7}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:24px}.latest{padding:20px}.latest h1{font-size:18px}.details{grid-template-columns:1fr 1fr}.details>div:last-child{grid-column:1/-1}.section-head{align-items:flex-start}.note{max-width:160px;text-align:right;line-height:1.5}.node{padding:19px}.empty{padding:35px 15px}}
.ip-option{margin-top:17px;padding-top:15px;border-top:1px solid #334b49}.ip-option .actions{margin-top:10px}.ip-url{font-size:15px;color:#d7e4f5;text-decoration:none;overflow-wrap:anywhere}.ip-option .host{line-height:1.7}</style></head><body>
<header><div class="top"><div class="brand"><div class="mark">N</div><div><div class="title">算力节点监控</div><div class="subtitle">镜像自动上报 · 地址随实例更新</div></div></div><div id="connection" class="connection"><i class="dot"></i><span>正在连接</span></div></div></header>
<main><div class="stats"><div class="stat online"><span>在线节点</span><strong id="online">—</strong></div><div class="stat"><span>已登记实例</span><strong id="total">—</strong></div><div class="stat"><span>离线判定</span><strong id="threshold">—</strong></div></div>
<section class="latest"><div class="eyebrow">最新上报地址</div><h1 id="latestAddress">等待节点首次上报</h1><p id="latestMeta">镜像开机后会自动登记，后续持续更新心跳。</p><div id="latestIp"></div><div class="actions"><button id="copyLatest" class="button primary" disabled>复制访问地址</button><a id="openLatest" class="button" target="_blank" rel="noopener noreferrer" hidden>打开工作台 ↗</a></div></section>
<div class="section-head"><h2>实例与在线状态</h2><div class="note" id="refreshState">每 5 秒刷新</div></div><div id="nodes" class="nodes"><div class="empty">正在获取节点信息…</div></div>
<footer id="footer">在线状态依据节点主动心跳；服务状态来自节点本地工作台检查。</footer></main><div id="toast" class="toast" hidden></div>
<script>
function ipControls(node){
  const section=el('div','ip-option');
  if(!node?.ip_url)return section;
  section.append(el('div','label','IP 备用地址 · '+(node.ip_address_source==='domain_dns'?'域名解析 IP':'上报来源 IP')));
  const address=el('a','ip-url',node.ip_url);
  address.href=node.ip_url;address.target='_blank';address.rel='noopener noreferrer';
  const actions=el('div','actions'),button=el('button','button','复制 IP 地址');
  button.onclick=()=>copy(node.ip_url);
  const open=link(node.ip_url);open.textContent='尝试 IP 访问 ↗';
  actions.append(button,open);
  section.append(address,actions,el('div','host','IP 直连取决于实例端口映射；平台网关可能要求使用域名。'));
  return section;
}
const $=id=>document.getElementById(id);let latest='',timer;const api=new URL('api/nodes',location.href);function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function date(value){return new Date(value*1000).toLocaleString('zh-CN',{hour12:false})}function age(seconds){if(seconds<60)return Math.floor(seconds)+' 秒前';if(seconds<3600)return Math.floor(seconds/60)+' 分钟前';return Math.floor(seconds/3600)+' 小时前'}async function copy(text){try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else{const input=el('textarea');input.value=text;document.body.append(input);input.select();if(!document.execCommand('copy'))throw Error();input.remove()}$('toast').textContent='访问地址已复制';$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,1800)}catch{$('toast').textContent='复制未完成，请选择地址手动复制';$('toast').hidden=false}}function details(label,value){const d=el('div');d.append(el('div','label',label),el('div','value',value||'—'));return d}function link(url){const a=el('a','button','打开工作台 ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}function render(data){$('online').textContent=data.online_count;$('total').textContent=data.total_count;$('threshold').textContent=data.offline_after+' 秒';const nodes=data.nodes,first=nodes[0];latest=first?.primary_url||'';$('latestIp').replaceChildren(...(first?[ipControls(first)]:[]));$('copyLatest').disabled=!latest;$('openLatest').hidden=!latest;if(first){$('latestAddress').textContent=latest;$('openLatest').href=latest;$('latestMeta').textContent=(first.online?'当前在线':'当前已离线')+' · '+first.name+' · IP '+first.ip_address+' · 端口 '+(new URL(latest).port||(latest.startsWith('https:')?'443':'80'))+' · '+date(first.last_seen)}$('nodes').replaceChildren();if(!nodes.length)$('nodes').append(el('div','empty','暂未收到节点心跳。镜像启动后会自动出现在这里。'));for(const n of nodes){const card=el('article','node'+(n.online?'':' offline'));card.dataset.nodeId=n.node_id;const top=el('div','node-top'),identity=el('div');identity.append(el('div','name',n.name),el('div','host',n.hostname+(n.region?' · '+n.region:'')));const state=!n.online?'离线':n.api_ready?'在线 · 服务就绪':'在线 · 服务启动中',badge=el('div','badge'+(!n.online?' off':!n.api_ready?' warn':''));badge.append(el('i','dot'),document.createTextNode(state));top.append(identity,badge);const grid=el('div','details');grid.append(details('访问 IP / 固定端口',n.ip_address+' : '+(new URL(n.primary_url).port||n.public_port)),details('最近心跳',age(n.age_seconds)+' · '+date(n.last_seen)),details('上报来源 IP',n.source_ip));const actions=el('div','actions'),button=el('button','button','复制地址');button.onclick=()=>copy(n.primary_url);actions.append(button,link(n.primary_url));card.append(top,el('div','address',n.primary_url),ipControls(n),grid);if(n.address_source==='observed_ip')card.append(el('div','host','未提供域名，当前显示上报来源 IP 与固定端口；访问以实例端口映射为准。'));if(n.online&&!n.api_ready)card.append(el('div','host',n.service_message));card.append(actions);$('nodes').append(card)}$('refreshState').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});$('connection').classList.remove('error');$('connection').querySelector('span').textContent='实时连接';$('footer').textContent='每 5 秒刷新 · 超过 '+data.offline_after+' 秒未上报即标记离线 · 节点地址和在线状态会随镜像实例自动更新。'}let loading=false;async function refresh(){if(loading)return;loading=true;try{const response=await fetch(api,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error();render(await response.json())}catch{$('connection').classList.add('error');$('connection').querySelector('span').textContent='连接中断，自动重试';$('refreshState').textContent='监控连接失败，当前为上次数据'}finally{loading=false}}$('copyLatest').onclick=()=>latest&&copy(latest);refresh();setInterval(refresh,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
