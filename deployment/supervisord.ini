[unix_http_server]
file=/root/minimax-node/outputs/runtime/supervisor.sock
chmod=0700
[supervisord]
logfile=/root/minimax-node/logs/supervisor.log
pidfile=/root/minimax-node/outputs/runtime/supervisor.pid
childlogdir=/root/minimax-node/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///root/minimax-node/outputs/runtime/supervisor.sock
[program:minimax-comfy]
command=/root/miniconda3/bin/python /root/minimax-node/deployment/run_service.py comfy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/root/minimax-node/logs/comfy-managed.log
redirect_stderr=true
priority=10
[program:minimax-api]
command=/root/miniconda3/bin/python /root/minimax-node/deployment/run_service.py api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/root/minimax-node/logs/api-managed.log
redirect_stderr=true
priority=20

[program:gpu-runtime-watchdog]
command=/root/miniconda3/bin/python -u /root/minimax-node/deployment/runtime_watchdog.py
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/root/minimax-node/logs/gpu-runtime-watchdog.log
redirect_stderr=true
priority=30

[program:cache-janitor]
command=/root/miniconda3/bin/python -u /root/minimax-node/deployment/cache_janitor.py --watch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/root/minimax-node/logs/cache-janitor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
priority=40
