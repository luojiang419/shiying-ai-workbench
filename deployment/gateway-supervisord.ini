[unix_http_server]
file=/root/minimax-node/outputs/runtime/gateway-supervisor.sock
chmod=0700
[supervisord]
logfile=/root/minimax-node/logs/gateway-supervisor.log
pidfile=/root/minimax-node/outputs/runtime/gateway-supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///root/minimax-node/outputs/runtime/gateway-supervisor.sock
[program:minimax-gateway]
command=/usr/local/bin/node /root/minimax-node/deployment/gateway.cjs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/root/minimax-node/logs/gateway.log
redirect_stderr=true
